; Production PHP settings for the MoneyMentor API
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 128M
max_execution_time = 30

; Article images are capped at 5MB in code; leave a little headroom here
upload_max_filesize = 6M
post_max_size = 8M

date.timezone = UTC

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
